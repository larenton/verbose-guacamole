name: Deploy to GitHub Pages

# Builds the static bundle and publishes it to GitHub Pages on every push to
# main. The published site contains NO real data: names are reduced to initials
# at import time and salary figures live only in the visitor's own browser
# (IndexedDB). The bundled demo dataset is entirely fictional.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Enables GitHub Pages (build type: GitHub Actions) automatically on first
      # run, so no manual Settings toggle is needed.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # SPA fallback: serve index.html for any unknown path so a deep refresh
      # never 404s, even before hash routing kicks in.
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Prevent Jekyll processing
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
