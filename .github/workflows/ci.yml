name: CI

# Source-control CI only. This project is local-first and is NOT deployed:
# the plan contains named staff and salary-derived rates, so there is no
# published site (GitHub Pages from a private repo would still be public).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Engine tests
        # The seed workbook is gitignored (salary data), so the migration-fidelity
        # golden suite self-skips here; the pure engine tests always run.
        run: npm test

      - name: Build
        run: npm run build
